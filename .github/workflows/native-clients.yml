name: Native clients
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Build and validate Python distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python tests/check_python_distribution.py dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Development smoke test only; the packaged runtime remains Python stdlib-only.
      - run: npm install --prefix "${{ runner.temp }}/mcp-sdk" --no-save --no-audit --no-fund --ignore-scripts @modelcontextprotocol/sdk@1.30.1
      - run: python tests/run_mcp_sdk.py
        env:
          MCP_SDK_ROOT: ${{ runner.temp }}/mcp-sdk/node_modules/@modelcontextprotocol/sdk
      - run: node tests/test_frontend.js
      - run: node tests/test_insights_frontend.js
      - run: node tests/test_mcp_frontend.js
      - run: node tests/test_mcp_insights_parity.js
      - run: node tests/test_timeline_frontend.js
      - run: node tests/test_maintenance_frontend.js
      - run: node tests/test_local_servers_frontend.js
      - run: node tests/test_subagent_sessions_frontend.js
      - run: node tests/test_reasoning_effort_frontend.js
      - if: runner.os == 'Windows'
        run: python windows/tray.py --self-test
      - if: runner.os == 'Windows'
        run: python tests/run_windows_native.py --screenshots windows-ui-fixtures
      - if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-fixtures
          path: windows-ui-fixtures/*.png
          if-no-files-found: warn
      - if: runner.os == 'Windows'
        run: python install.py --no-launch
      - if: runner.os == 'macOS'
        run: swift build --package-path macos/AgentTelemetryMac
      - if: runner.os == 'macOS'
        run: python tests/run_mac_native.py
