name: Native clients
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The installed apps bundle CPython 3.15.2: run the unit tests on 3.15 too, then 3.13 for everything after.
      - uses: actions/setup-python@v5
        id: bundled-python
        with:
          python-version: '3.15'
      - name: Unit tests on the bundled runtime's Python
        shell: bash
        env:
          BUNDLED_PYTHON: ${{ steps.bundled-python.outputs.python-path }}
        run: '"$BUNDLED_PYTHON" -m unittest discover -s tests'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Build and validate Python distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python tests/check_python_distribution.py dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_frontend.js
      - run: node tests/test_release_notes_frontend.js
      - run: node tests/test_extensions_frontend.js
      - run: node tests/test_timeline_frontend.js
      - run: node tests/test_maintenance_frontend.js
      - run: node tests/test_local_servers_frontend.js
      - run: node tests/test_subagent_sessions_frontend.js
      - run: node tests/test_reasoning_effort_frontend.js
      - run: node tests/test_antigravity_frontend.js
      - run: node tests/test_cursor_frontend.js
      - run: node tests/test_retention_frontend.js
      - run: node tests/validate_palette.js
      - if: runner.os == 'Windows'
        run: python windows/tray.py --self-test
      - if: runner.os == 'Windows'
        run: python tests/run_windows_native.py --screenshots windows-ui-fixtures
      - if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-fixtures
          path: windows-ui-fixtures/*.png
          if-no-files-found: warn
      - if: runner.os == 'Windows'
        run: python install.py --no-launch
      - if: runner.os == 'macOS'
        run: swift build --package-path macos/AgentTelemetryMac
      - if: runner.os == 'macOS'
        run: python tests/run_mac_native.py --screenshots macos-ui-fixtures
      - if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-fixtures
          path: macos-ui-fixtures/*.png
          if-no-files-found: warn
